# ─────────────────────────────────────────────────────────────────────
# Wordtime CMS — конфиг nginx (PHP 8.3-FPM + MariaDB)
# Скопируйте в /etc/nginx/sites-available/wordtime.conf, поправьте
# server_name и root, затем:
#   ln -s /etc/nginx/sites-available/wordtime.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# HTTPS: certbot --nginx
# ─────────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name vash-domen.ru;                      # ← ваш домен
    root /var/www/Wordtime_cms;                     # ← путь к файлам CMS
    index index.php;
    charset utf-8;
    client_max_body_size 25m;

    # Установщик защищён САМ: после первой установки install.php
    # показывает «Wordtime уже установлен» и не запускается повторно
    # (как в WordPress). Блокировать его на уровне nginx не нужно —
    # иначе установка по инструкции станет невозможной.
    # Если хотите дополнительную защиту на уровне сервера ПОСЛЕ
    # установки — раскомментируйте блок ниже:
    # location = /install.php { deny all; }

    # Служебные каталоги — только статика
    location /wt-includes/ { location ~ \.php$ { deny all; } try_files $uri =404; }
    location /wt-data/     { deny all; }

    # Красивые ссылки (необязательно — без них работают ?p=… и ?admin=1)
    location /post/     { try_files $uri /index.php?$args; }
    location /page/     { try_files $uri /index.php?$args; }
    location /category/ { try_files $uri /index.php?$args; }
    location = /sitemap.xml { try_files $uri /index.php?p=sitemap.xml&$args; }
    location = /robots.txt  { try_files $uri /index.php?p=robots.txt&$args; }

    # PHP через FPM
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock; # ← ваш сокет FPM
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_index index.php;
    }

    # Заголовки безопасности
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # Кеш статики + сжатие
    location ~* \.(css|js|jpg|jpeg|png|gif|webp|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
