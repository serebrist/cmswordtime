# Wordtime CMS 1.0.5 — конфиг nginx (PHP 8.3-FPM + MariaDB)
# Установка:
#   cp nginx-wordtime.conf /etc/nginx/sites-available/wordtime.conf
#   ln -s /etc/nginx/sites-available/wordtime.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Без этого файла CMS тоже работает (маршруты вида /?p=... и /?admin=1).
# Файл добавляет красивые ссылки /post/заголовок/, защиту и кеш статики.

server {
    listen 80;
    server_name ваш-домен.ru;

    # корень сайта — куда распакован Wordtime_cms
    root /var/www/Wordtime_cms;
    index index.php;
    charset utf-8;

    client_max_body_size 25m;

    # защита служебных файлов и данных
    location = /wt-config.php { deny all; }
    location ^~ /wt-data/ { deny all; }
    location ^~ /wt-includes/ { deny all; }
    location = /install.php { deny all; }  # удалить после установки (или оставить запрет)

    # красивые ссылки → единая точка входа index.php
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # PHP 8.3-FPM
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 120s;
    }

    # кеш и сжатие статики
    location ~* \.(css|js|jpg|jpeg|png|gif|webp|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # заголовки безопасности
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/wordtime-access.log;
    error_log /var/log/nginx/wordtime-error.log;
}

# HTTPS: после certbot --nginx блок listen 80 дополнится автоматически.
